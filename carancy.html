<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Checker & Calculator</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
            color: white;
            padding: 30px 15px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 38px;
            margin-bottom: 8px;
        }

        header p {
            color: #cbd5e1;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }

        .card h2 {
            margin-bottom: 20px;
            font-size: 24px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            color: #dbeafe;
        }

        input,
        select {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #f8fafc;
            color: #111827;
            font-size: 16px;
            outline: none;
        }

        .currency-row {
            display: grid;
            grid-template-columns: 1fr 55px 1fr;
            gap: 10px;
            align-items: end;
        }

        .swap {
            height: 48px;
            border: none;
            border-radius: 10px;
            background: #38bdf8;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        .swap:hover {
            background: #0ea5e9;
        }

        .convert-btn {
            width: 100%;
            padding: 15px;
            margin-top: 22px;
            border: none;
            border-radius: 10px;
            background: #22c55e;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .convert-btn:hover {
            background: #16a34a;
        }

        .result {
            margin-top: 22px;
            padding: 20px;
            border-radius: 12px;
            background: rgba(0,0,0,0.2);
            text-align: center;
        }

        .result .amount {
            font-size: 30px;
            font-weight: bold;
            color: #67e8f9;
        }

        .result .rate {
            margin-top: 10px;
            color: #cbd5e1;
        }

        /* Calculator */

        .calculator {
            margin-top: 25px;
        }

        .display {
            width: 100%;
            height: 70px;
            border: none;
            border-radius: 12px;
            background: #020617;
            color: white;
            font-size: 30px;
            text-align: right;
            padding: 15px;
            margin-bottom: 15px;
        }

        .keys {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .key {
            height: 60px;
            border: none;
            border-radius: 10px;
            background: #334155;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        .key:hover {
            background: #475569;
        }

        .operator {
            background: #f97316;
        }

        .operator:hover {
            background: #ea580c;
        }

        .equal {
            background: #22c55e;
        }

        .clear {
            background: #ef4444;
        }

        .countries {
            margin-top: 25px;
        }

        .countries h2 {
            margin-bottom: 15px;
        }

        .country-list {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            max-height: 300px;
            overflow-y: auto;
        }

        .country {
            background: rgba(255,255,255,0.08);
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
        }

        footer {
            text-align: center;
            margin-top: 30px;
            color: #cbd5e1;
        }

        @media (max-width: 750px) {
            .grid {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 30px;
            }

            .country-list {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 450px) {
            .currency-row {
                grid-template-columns: 1fr;
            }

            .swap {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <header>
        <h1>💱 Currency Checker</h1>
        <p>Convert currencies and calculate your amounts easily</p>
    </header>

    <div class="grid">

        <!-- Currency Converter -->
        <div class="card">
            <h2>Currency Converter</h2>

            <label for="amount">Amount</label>
            <input
                type="number"
                id="amount"
                value="1"
                min="0"
                placeholder="Enter amount"
            >

            <div class="currency-row">

                <div>
                    <label for="fromCurrency">From</label>
                    <select id="fromCurrency"></select>
                </div>

                <button class="swap" onclick="swapCurrencies()">
                    ⇄
                </button>

                <div>
                    <label for="toCurrency">To</label>
                    <select id="toCurrency"></select>
                </div>

            </div>

            <button class="convert-btn" onclick="convertCurrency()">
                Convert
            </button>

            <div class="result">
                <div id="result" class="amount">
                    1 USD = 1 USD
                </div>

                <div id="rate" class="rate">
                    Exchange rate will appear here
                </div>
            </div>
        </div>


        <!-- Calculator -->
        <div class="card">

            <h2>Calculator</h2>

            <div class="calculator">

                <input
                    type="text"
                    id="display"
                    class="display"
                    value="0"
                    readonly
                >

                <div class="keys">

                    <button class="key clear" onclick="clearCalculator()">C</button>
                    <button class="key" onclick="deleteNumber()">⌫</button>
                    <button class="key operator" onclick="addOperator('%')">%</button>
                    <button class="key operator" onclick="addOperator('/')">÷</button>

                    <button class="key" onclick="addNumber('7')">7</button>
                    <button class="key" onclick="addNumber('8')">8</button>
                    <button class="key" onclick="addNumber('9')">9</button>
                    <button class="key operator" onclick="addOperator('*')">×</button>

                    <button class="key" onclick="addNumber('4')">4</button>
                    <button class="key" onclick="addNumber('5')">5</button>
                    <button class="key" onclick="addNumber('6')">6</button>
                    <button class="key operator" onclick="addOperator('-')">−</button>

                    <button class="key" onclick="addNumber('1')">1</button>
                    <button class="key" onclick="addNumber('2')">2</button>
                    <button class="key" onclick="addNumber('3')">3</button>
                    <button class="key operator" onclick="addOperator('+')">+</button>

                    <button class="key" onclick="addNumber('0')">0</button>
                    <button class="key" onclick="addNumber('.')">.</button>
                    <button class="key equal" onclick="calculate()">=</button>

                </div>
            </div>

        </div>

    </div>


    <!-- Country List -->
    <div class="card countries">

        <h2>🌎 Countries & Currencies</h2>

        <div class="country-list" id="countryList"></div>

    </div>


    <footer>
        © 2026 Currency Checker | Built with HTML, CSS & JavaScript
    </footer>

</div>


<script>

    // Currency list
    const currencies = {
        USD: "🇺🇸 United States Dollar",
        EUR: "🇪🇺 Euro",
        GBP: "🇬🇧 British Pound",
        PKR: "🇵🇰 Pakistani Rupee",
        INR: "🇮🇳 Indian Rupee",
        AED: "🇦🇪 UAE Dirham",
        SAR: "🇸🇦 Saudi Riyal",
        QAR: "🇶🇦 Qatari Riyal",
        KWD: "🇰🇼 Kuwaiti Dinar",
        BHD: "🇧🇭 Bahraini Dinar",
        OMR: "🇴🇲 Omani Rial",
        JPY: "🇯🇵 Japanese Yen",
        CNY: "🇨🇳 Chinese Yuan",
        KRW: "🇰🇷 South Korean Won",
        CAD: "🇨🇦 Canadian Dollar",
        AUD: "🇦🇺 Australian Dollar",
        NZD: "🇳🇿 New Zealand Dollar",
        CHF: "🇨🇭 Swiss Franc",
        SGD: "🇸🇬 Singapore Dollar",
        HKD: "🇭🇰 Hong Kong Dollar",
        MYR: "🇲🇾 Malaysian Ringgit",
        THB: "🇹🇭 Thai Baht",
        TRY: "🇹🇷 Turkish Lira",
        ZAR: "🇿🇦 South African Rand",
        RUB: "🇷🇺 Russian Ruble",
        BRL: "🇧🇷 Brazilian Real",
        MXN: "🇲🇽 Mexican Peso",
        SEK: "🇸🇪 Swedish Krona",
        NOK: "🇳🇴 Norwegian Krone",
        DKK: "🇩🇰 Danish Krone",
        PLN: "🇵🇱 Polish Zloty",
        IDR: "🇮🇩 Indonesian Rupiah",
        VND: "🇻🇳 Vietnamese Dong",
        PHP: "🇵🇭 Philippine Peso",
        EGP: "🇪🇬 Egyptian Pound",
        NGN: "🇳🇬 Nigerian Naira",
        LKR: "🇱🇰 Sri Lankan Rupee",
        BDT: "🇧🇩 Bangladeshi Taka",
        NPR: "🇳🇵 Nepalese Rupee"
    };


    const fromCurrency = document.getElementById("fromCurrency");
    const toCurrency = document.getElementById("toCurrency");


    // Create dropdown options
    for (let code in currencies) {

        let option1 = document.createElement("option");
        option1.value = code;
        option1.textContent = code + " - " + currencies[code];

        let option2 = option1.cloneNode(true);

        fromCurrency.appendChild(option1);
        toCurrency.appendChild(option2);
    }


    // Default currencies
    fromCurrency.value = "USD";
    toCurrency.value = "PKR";


    // Currency conversion
    async function convertCurrency() {

        const amount = parseFloat(
            document.getElementById("amount").value
        );

        const from = fromCurrency.value;
        const to = toCurrency.value;

        if (isNaN(amount) || amount < 0) {
            alert("Please enter a valid amount.");
            return;
        }

        if (from === to) {

            document.getElementById("result").textContent =
                amount.toFixed(2) + " " + to;

            document.getElementById("rate").textContent =
                "1 " + from + " = 1 " + to;

            return;
        }


        try {

            const response = await fetch(
                `https://api.frankfurter.app/latest?amount=${amount}&from=${from}&to=${to}`
            );

            if (!response.ok) {
                throw new Error("API error");
            }

            const data = await response.json();

            const converted = data.rates[to];

            document.getElementById("result").textContent =
                converted.toLocaleString(undefined, {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                }) + " " + to;


            const rateResponse = await fetch(
                `https://api.frankfurter.app/latest?amount=1&from=${from}&to=${to}`
            );

            const rateData = await rateResponse.json();

            const rate = rateData.rates[to];

            document.getElementById("rate").textContent =
                "1 " + from + " = " +
                rate.toFixed(4) + " " + to;

        } catch (error) {

            document.getElementById("result").textContent =
                "Unable to get exchange rate.";

            document.getElementById("rate").textContent =
                "Please check your internet connection.";

        }
    }


    // Swap currencies
    function swapCurrencies() {

        const temp = fromCurrency.value;

        fromCurrency.value = toCurrency.value;
        toCurrency.value = temp;

        convertCurrency();
    }


    // Country list
    const countryList = document.getElementById("countryList");

    for (let code in currencies) {

        const country = document.createElement("div");

        country.className = "country";

        country.innerHTML =
            `<strong>${code}</strong><br>${currencies[code]}`;

        countryList.appendChild(country);
    }


    // Calculator
    const display = document.getElementById("display");


    function addNumber(number) {

        if (display.value === "0") {
            display.value = number;
        } else {
            display.value += number;
        }
    }


    function addOperator(operator) {

        const lastCharacter =
            display.value.slice(-1);

        if (
            ["+", "-", "*", "/", "%"].includes(lastCharacter)
        ) {
            return;
        }

        display.value += operator;
    }


    function clearCalculator() {

        display.value = "0";
    }


    function deleteNumber() {

        if (display.value.length <= 1) {
            display.value = "0";
        } else {
            display.value =
                display.value.slice(0, -1);
        }
    }


    function calculate() {

        try {

            let expression = display.value;

            let result = Function(
                '"use strict"; return (' + expression + ')'
            )();

            if (!isFinite(result)) {
                throw new Error();
            }

            display.value = result;

        } catch {

            display.value = "Error";

            setTimeout(() => {
                display.value = "0";
            }, 1200);
        }
    }


    // Enter key for calculator
    document.addEventListener("keydown", function(event) {

        const key = event.key;

        if (
            (key >= "0" && key <= "9") ||
            ["+", "-", "*", "/", ".", "%"].includes(key)
        ) {

            if (display.value === "0") {
                display.value = key;
            } else {
                display.value += key;
            }
        }

        if (key === "Enter") {
            calculate();
        }

        if (key === "Backspace") {
            deleteNumber();
        }

        if (key === "Escape") {
            clearCalculator();
        }

    });


    // Convert when page loads
    convertCurrency();

</script>

</body>
</html>
